<!DOCTYPE html>
<html lang="en" data-portal-template="{{ branding.template }}" style="--primary-color:{{ branding.primary_color }};--accent-color:{{ branding.accent_color }};--gradient-start:{{ branding.background_gradient_start }};">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ branding.portal_display_name or "Success" }} — ISP Hotspot</title>
{% include "_head.html" %}
</head>
<body>
    <div class="container">
        <div class="card">
{% include "_brand_logo.html" %}
            <h1>Payment successful</h1>
            <p class="subtitle">Your voucher code is ready</p>

            <div id="statusBox" class="muted">
                <span class="spinner"></span>
                Fetching voucher…
            </div>

            <div id="mainBox" style="display:none">
                <div class="code-box">
                    <div id="voucherCode" class="code-text"></div>
                    <button id="copyBtn" class="btn btn-outline" type="button">Copy code</button>
                </div>

                <div id="planInfo" class="plan-card" style="margin-top:12px"></div>

                <button id="connectBtn" class="btn btn-primary" type="button" style="margin-top:16px">Connect now</button>
                <div id="connectError" class="alert alert-error" style="display:none;margin-top:12px"></div>
            </div>
{% include "_brand_footer.html" %}
        </div>
    </div>

    <script>
    (function(){
        var ref = {{ ref | tojson }};
        var params = new URLSearchParams(window.location.search);
        var gateway = params.get("gateway") || {{ (gateway or '10.5.50.1') | tojson }};
        // rt rides in via pay.html's redirect; branding.js also persists it to
        // sessionStorage["portal.rt"] on every hop. /portal/authenticate needs it
        // to resolve the operator for VPN-only routers (no matchable ip_address).
        var rt = params.get("rt") || "";
        try { rt = rt || sessionStorage.getItem("portal.rt") || ""; } catch(e) {}
        function qs(id){ return document.getElementById(id); }
        function fmtSpeed(kbps){ var mbps=(kbps||0)/1000; return (mbps%1===0?mbps.toFixed(0):mbps.toFixed(1))+" Mbps"; }
        function fmtCap(p){
            if(!p) return "";
            var parts=[];
            if ((p.type==="time"||p.type==="hybrid") && p.duration_minutes){
                var m=p.duration_minutes;
                parts.push((m>=60 && m%60===0)?((m/60)+" hrs"):(m+" mins"));
            }
            if ((p.type==="data"||p.type==="hybrid") && p.data_limit_mb){
                var mb=p.data_limit_mb;
                parts.push((mb>=1024 && mb%1024===0)?((mb/1024)+" GB"):(mb>=1024?((mb/1024).toFixed(1)+" GB"):(mb+" MB")));
            }
            return parts.join(" + ");
        }

        // Wall-clock deadline, not a try count. A try count meant one slow verify
        // could burn the whole budget: 5 tries x 3s looks like 15s of patience,
        // but a single 15s provider timeout consumed it in ONE attempt and
        // dropped the customer on "Contact support" while their payment was
        // still being confirmed (and usually succeeded moments later).
        var DEADLINE_MS = 90000;
        var POLL_MS = 3000;
        var deadline = Date.now() + DEADLINE_MS;
        var waiting = false;

        function timeLeft(){ return deadline - Date.now(); }

        function retryOrGiveUp(delayMs){
            var left = timeLeft();
            if(left <= 0){ giveUp(); return; }
            var wait = Math.min(delayMs || POLL_MS, left);
            if(!waiting){
                waiting = true;
                qs("statusBox").innerHTML =
                    '<span class="spinner"></span> Still confirming your payment. This can take a minute…';
            }
            setTimeout(load, wait);
        }

        function giveUp(){
            qs("statusBox").innerHTML =
                'We could not confirm your payment in time. If you were charged, ' +
                'your voucher is still being issued — please contact support with ' +
                'reference <strong>' + String(ref).replace(/[<>&]/g, "") + '</strong>.';
        }

        function load(){
            fetch("/portal/payment-status?ref="+encodeURIComponent(ref), { headers: { "Accept":"application/json" } })
                .then(function(r){
                    var retryAfter = parseInt(r.headers.get("Retry-After") || "", 10);
                    return r.json().catch(function(){ return {}; }).then(function(j){
                        return { ok:r.ok, status:r.status, body:j, retryAfter:retryAfter };
                    });
                })
                .then(function(res){
                    if(!res.ok){
                        // 503 + Retry-After = provider unreachable, keep waiting on
                        // the server's terms. Anything else: back off and retry
                        // until the deadline rather than quitting on one blip.
                        var delay = (res.status === 503 && res.retryAfter > 0)
                            ? res.retryAfter * 1000 : POLL_MS;
                        retryOrGiveUp(delay);
                        return;
                    }
                    if(res.body.status === "failed"){
                        qs("statusBox").textContent =
                            res.body.failure_reason === "timeout"
                                ? "This payment timed out. You have not been charged."
                                : (res.body.display_message || "This payment did not go through.");
                        return;
                    }
                    if(res.body.status!=="success" || !res.body.voucher_code){
                        retryOrGiveUp(POLL_MS);
                        return;
                    }
                    qs("statusBox").style.display="none";
                    qs("mainBox").style.display="block";
                    qs("voucherCode").textContent = res.body.voucher_code;

                    var p = res.body.plan;
                    if(p){
                        var cap = fmtCap(p);
                        var speed = fmtSpeed(p.download_speed_kbps)+" down / "+fmtSpeed(p.upload_speed_kbps)+" up";
                        qs("planInfo").innerHTML =
                            '<div class="plan-name">'+(p.name||"Plan")+'</div>'+
                            '<div class="plan-meta">'+speed+'</div>'+
                            (cap?('<div class="plan-meta">'+cap+'</div>'):'');
                    } else {
                        qs("planInfo").style.display="none";
                    }
                })
                .catch(function(){
                    // Transient network blip on the captive portal itself; the
                    // deadline is what decides when to stop, not the blip.
                    retryOrGiveUp(POLL_MS);
                });
        }

        function fallbackCopy(){
            try {
                var el = qs("voucherCode");
                var range = document.createRange();
                range.selectNodeContents(el);
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                var ok = document.execCommand("copy");
                sel.removeAllRanges();
                return ok;
            } catch(e){ return false; }
        }
        function flashCopied(ok){
            var b = qs("copyBtn");
            b.textContent = ok ? "Copied!" : "Select & hold to copy";
            setTimeout(function(){ b.textContent = "Copy code"; }, 2000);
        }

        function submitToMikroTik(routerGateway, username, password, dst) {
            var form = document.createElement("form");
            form.method = "POST";
            form.action = "http://" + routerGateway + "/login";

            var fields = {
                "username": username,
                "password": password,
                "dst": dst,
                "popup": "false"
            };

            for (var key in fields) {
                var input = document.createElement("input");
                input.type = "hidden";
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        }

        qs("copyBtn").addEventListener("click", function(){
            var code = (qs("voucherCode").textContent||"").trim();
            if(!code) return;
            if(navigator.clipboard && navigator.clipboard.writeText){
                navigator.clipboard.writeText(code)
                    .then(function(){ flashCopied(true); })
                    .catch(function(){ flashCopied(fallbackCopy()); });
            } else {
                flashCopied(fallbackCopy());
            }
        });

        qs("connectBtn").addEventListener("click", function(){
            qs("connectError").style.display="none";
            qs("connectError").textContent="";
            var code = (qs("voucherCode").textContent||"").trim();
            var originalUrl = "/";
            try { originalUrl = sessionStorage.getItem("portal.original_url") || "/"; } catch(e) {}
            var fd = new FormData();
            fd.append("code", code);
            fd.append("url", originalUrl);
            if(gateway) fd.append("gateway", gateway);
            if(rt) fd.append("rt", rt);
            fetch("/portal/authenticate", { method:"POST", body: fd, headers: { "Accept":"application/json" } })
                .then(function(response){
                    return response.json().catch(function(){ return {}; }).then(function(body){
                        return { ok: response.ok, body: body };
                    });
                })
                .then(function(result){
                    if(!result.ok || !result.body.success){
                        throw new Error(result.body.detail || "Unable to connect. Please try again.");
                    }
                    submitToMikroTik(
                        gateway || "10.5.50.1",
                        result.body.username,
                        result.body.password,
                        originalUrl
                    );
                })
                .catch(function(err){
                    qs("connectError").style.display="flex";
                    qs("connectError").textContent=(err && err.message) || "Unable to connect. Please try again.";
                });
        });

        load();
    })();
    </script>
</body>
</html>
