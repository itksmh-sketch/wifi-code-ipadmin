# FreeRADIUS SQL Configuration — PostgreSQL
# This module handles voucher authentication against the hotspot database

sql sql_hotspot {
    driver = "rlm_sql_postgresql"

    # Database connection
    dialect = "postgresql"
    radius_db = "host=postgres port=5432 dbname=$ENV{POSTGRES_DB} user=$ENV{POSTGRES_USER} password=$ENV{POSTGRES_PASSWORD}"
    sql_user_name = "%{User-Name}"

    # Connection pool
    num_sql_socks = 5
    connect_failure_retry_delay = 60
    max_queries = 0

    # =====================================================
    # AUTHORIZE QUERY
    # Looks up voucher by username, validates status,
    # returns bandwidth attributes and session timeout.
    # =====================================================
    authorize_check_query = "SELECT 1 AS id, '%{SQL-User-Name}' AS username, 'Cleartext-Password' AS attribute, v.password AS value, ':=' AS op FROM vouchers v JOIN plans p ON p.id = v.plan_id JOIN routers r ON r.wg_tunnel_ip = '%{NAS-IP-Address}'::inet WHERE (v.code = '%{SQL-User-Name}' OR v.username = '%{SQL-User-Name}') AND v.isp_operator_id = r.isp_operator_id AND p.isp_operator_id = r.isp_operator_id AND v.status IN ('unused', 'active') AND (v.expires_at IS NULL OR v.expires_at > NOW()) AND (p.data_limit_mb IS NULL OR v.data_used_mb < p.data_limit_mb) AND p.is_active = true LIMIT 1"

    authorize_reply_query = "SELECT 1 AS id, '%{SQL-User-Name}' AS username, 'Mikrotik-Rate-Limit' AS attribute, p.download_speed_kbps || 'k/' || p.upload_speed_kbps || 'k' AS value, ':=' AS op FROM vouchers v JOIN plans p ON v.plan_id = p.id JOIN routers r ON r.wg_tunnel_ip = '%{NAS-IP-Address}'::inet WHERE (v.code = '%{SQL-User-Name}' OR v.username = '%{SQL-User-Name}') AND v.isp_operator_id = r.isp_operator_id AND p.isp_operator_id = r.isp_operator_id AND p.is_active = true UNION SELECT 2 AS id, '%{SQL-User-Name}' AS username, 'WISPr-Bandwidth-Max-Down' AS attribute, p.download_speed_kbps::text AS value, ':=' AS op FROM vouchers v JOIN plans p ON v.plan_id = p.id JOIN routers r ON r.wg_tunnel_ip = '%{NAS-IP-Address}'::inet WHERE (v.code = '%{SQL-User-Name}' OR v.username = '%{SQL-User-Name}') AND v.isp_operator_id = r.isp_operator_id AND p.isp_operator_id = r.isp_operator_id AND p.is_active = true UNION SELECT 3 AS id, '%{SQL-User-Name}' AS username, 'WISPr-Bandwidth-Max-Up' AS attribute, p.upload_speed_kbps::text AS value, ':=' AS op FROM vouchers v JOIN plans p ON v.plan_id = p.id JOIN routers r ON r.wg_tunnel_ip = '%{NAS-IP-Address}'::inet WHERE (v.code = '%{SQL-User-Name}' OR v.username = '%{SQL-User-Name}') AND v.isp_operator_id = r.isp_operator_id AND p.isp_operator_id = r.isp_operator_id AND p.is_active = true UNION SELECT 4 AS id, '%{SQL-User-Name}' AS username, 'Session-Timeout' AS attribute, CASE WHEN v.expires_at IS NOT NULL THEN GREATEST(60, EXTRACT(EPOCH FROM (v.expires_at - NOW()))::integer)::text WHEN p.duration_minutes IS NOT NULL AND p.type IN ('time', 'hybrid') THEN (p.duration_minutes * 60)::text ELSE '86400' END AS value, ':=' AS op FROM vouchers v JOIN plans p ON v.plan_id = p.id JOIN routers r ON r.wg_tunnel_ip = '%{NAS-IP-Address}'::inet WHERE (v.code = '%{SQL-User-Name}' OR v.username = '%{SQL-User-Name}') AND v.isp_operator_id = r.isp_operator_id AND p.isp_operator_id = r.isp_operator_id AND p.is_active = true UNION SELECT 5 AS id, '%{SQL-User-Name}' AS username, 'Acct-Interim-Interval' AS attribute, '60' AS value, ':=' AS op FROM vouchers v JOIN plans p ON v.plan_id = p.id JOIN routers r ON r.wg_tunnel_ip = '%{NAS-IP-Address}'::inet WHERE (v.code = '%{SQL-User-Name}' OR v.username = '%{SQL-User-Name}') AND v.isp_operator_id = r.isp_operator_id AND p.isp_operator_id = r.isp_operator_id AND p.is_active = true UNION SELECT 6 AS id, '%{SQL-User-Name}' AS username, 'Mikrotik-Total-Limit' AS attribute, mod((((p.data_limit_mb::bigint - v.data_used_mb::bigint) * 1048576) - CASE WHEN mod(((p.data_limit_mb::bigint - v.data_used_mb::bigint) * 1048576), 4294967296) = 0 THEN 1 ELSE 0 END), 4294967296)::text AS value, ':=' AS op FROM vouchers v JOIN plans p ON v.plan_id = p.id JOIN routers r ON r.wg_tunnel_ip = '%{NAS-IP-Address}'::inet WHERE (v.code = '%{SQL-User-Name}' OR v.username = '%{SQL-User-Name}') AND v.isp_operator_id = r.isp_operator_id AND p.isp_operator_id = r.isp_operator_id AND p.is_active = true AND p.data_limit_mb IS NOT NULL AND p.data_limit_mb > v.data_used_mb UNION SELECT 7 AS id, '%{SQL-User-Name}' AS username, 'Mikrotik-Total-Limit-Gigawords' AS attribute, ((((p.data_limit_mb::bigint - v.data_used_mb::bigint) * 1048576) - CASE WHEN mod(((p.data_limit_mb::bigint - v.data_used_mb::bigint) * 1048576), 4294967296) = 0 THEN 1 ELSE 0 END) / 4294967296)::text AS value, ':=' AS op FROM vouchers v JOIN plans p ON v.plan_id = p.id JOIN routers r ON r.wg_tunnel_ip = '%{NAS-IP-Address}'::inet WHERE (v.code = '%{SQL-User-Name}' OR v.username = '%{SQL-User-Name}') AND v.isp_operator_id = r.isp_operator_id AND p.isp_operator_id = r.isp_operator_id AND p.is_active = true AND p.data_limit_mb IS NOT NULL AND p.data_limit_mb > v.data_used_mb AND (((p.data_limit_mb::bigint - v.data_used_mb::bigint) * 1048576) - CASE WHEN mod(((p.data_limit_mb::bigint - v.data_used_mb::bigint) * 1048576), 4294967296) = 0 THEN 1 ELSE 0 END) >= 4294967296"

    accounting {
        reference = "%{tolower:type.%{%{Acct-Status-Type}:-none}.query}"

        type {
            accounting-on {
                query = "SELECT 1"
            }

            accounting-off {
                query = "SELECT 1"
            }

            start {
                # Conditional activation: the INSERT runs FIRST and the voucher is
                # activated only for a session row that actually landed. Previously
                # the activate CTE was a sibling data-modifying CTE, so it fired even
                # when ON CONFLICT swallowed the INSERT — burning the customer's
                # plan (status=active, expires_at set) with no session to meter.
                #
                # ON CONFLICT is scoped (router_id, session_id): MikroTik
                # Acct-Session-Ids are per-router counters that repeat across
                # routers and across reboots, so a global unique key made one
                # router's reconnect collide with another router's stale row.
                query = "\
                  WITH ins AS ( \
                    INSERT INTO sessions ( \
                      id, isp_operator_id, voucher_id, router_id, username, \
                      mac_address, ip_address, nas_ip, session_id, \
                      started_at, last_interim_at, upload_bytes, download_bytes \
                    ) \
                    SELECT \
                      gen_random_uuid(), \
                      v.isp_operator_id, \
                      v.id, \
                      r.id, \
                      '%{SQL-User-Name}', \
                      NULLIF(NULLIF('%{Calling-Station-Id}', ''), 'unknown')::macaddr, \
                      NULLIF('%{Framed-IP-Address}', '')::inet, \
                      '%{NAS-IP-Address}'::inet, \
                      '%{Acct-Session-Id}', \
                      NOW(), \
                      NOW(), \
                      0, \
                      0 \
                    FROM vouchers v \
                    CROSS JOIN routers r \
                    WHERE (v.code = '%{SQL-User-Name}' OR v.username = '%{SQL-User-Name}') \
                    AND r.wg_tunnel_ip = '%{NAS-IP-Address}'::inet \
                    AND v.isp_operator_id = r.isp_operator_id \
                    ON CONFLICT (router_id, session_id) DO NOTHING \
                    RETURNING voucher_id \
                  ) \
                  UPDATE vouchers v \
                  SET status = 'active', \
                      activated_at = NOW(), \
                      expires_at = CASE \
                        WHEN v.expires_at IS NULL \
                        THEN (SELECT NOW() + (p.duration_minutes * INTERVAL '1 minute') \
                              FROM plans p \
                              WHERE p.id = v.plan_id \
                              AND p.isp_operator_id = v.isp_operator_id \
                              AND p.duration_minutes IS NOT NULL) \
                        ELSE v.expires_at \
                      END \
                  WHERE v.id IN (SELECT voucher_id FROM ins) \
                  AND v.status = 'unused'"
            }

            interim-update {
                # Scoped by router_id: without it the compound unique key is
                # pointless, because this UPDATE would still hit every router's
                # row that shares the Acct-Session-Id. update_voucher_usage now
                # takes sessions.id (uuid), which is unambiguous by construction.
                query = "WITH updated AS (UPDATE sessions SET upload_bytes = COALESCE(NULLIF('%{Acct-Input-Octets}', '')::bigint, 0), download_bytes = COALESCE(NULLIF('%{Acct-Output-Octets}', '')::bigint, 0), last_interim_at = NOW() WHERE session_id = '%{Acct-Session-Id}' AND router_id = (SELECT id FROM routers WHERE wg_tunnel_ip = '%{NAS-IP-Address}'::inet) RETURNING id) SELECT update_voucher_usage(id) FROM updated"
            }

            stop {
                query = "WITH updated AS (UPDATE sessions SET stopped_at = NOW(), upload_bytes = COALESCE(NULLIF('%{Acct-Input-Octets}', '')::bigint, 0), download_bytes = COALESCE(NULLIF('%{Acct-Output-Octets}', '')::bigint, 0), last_interim_at = NOW(), terminate_cause = NULLIF('%{Acct-Terminate-Cause}', '') WHERE session_id = '%{Acct-Session-Id}' AND router_id = (SELECT id FROM routers WHERE wg_tunnel_ip = '%{NAS-IP-Address}'::inet) RETURNING id) SELECT update_voucher_usage(id) FROM updated"
            }
        }
    }

    # =====================================================
    # POST-AUTH QUERY
    # Log authentication attempts
    # =====================================================
    postauth_query = "SELECT 1"

    read_groups = no

    # Dynamic client loading — FreeRADIUS reads this query at startup and registers
    # every returned row as a RADIUS client. No clients.conf entry needed for routers.
    #
    # Column order is mandatory for FreeRADIUS 3.2.x generate_sql_clients():
    #   0=id (unused but required), 1=nasname, 2=shortname, 3=type, 4=secret
    # A short/misordered result triggers "SELECT returned too few fields" and every
    # row is skipped (zero clients loaded).
    #
    # nasname is keyed on wg_tunnel_ip: the platform is VPN-only, so routers send
    # RADIUS over the tunnel and their packet source IP is their 10.100.0.x tunnel
    # address (requires the PRIMARY FreeRADIUS to be host-networked so it sees the
    # true source rather than a Docker-SNATed 172.x). nas_secret_plain holds the
    # per-router shared secret (backfilled by migration 019 for legacy/seed rows).
    read_clients = yes
    client_query = "\
      SELECT \
        r.id::varchar AS id, \
        r.wg_tunnel_ip::varchar AS nasname, \
        r.name AS shortname, \
        'other' AS type, \
        r.nas_secret_plain AS secret \
      FROM routers r \
      WHERE r.is_active = true \
        AND r.wg_tunnel_ip IS NOT NULL \
        AND r.nas_secret_plain IS NOT NULL"

    # Table mappings
    usergroup_table = "radusergroup"
}
