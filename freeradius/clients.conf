# FreeRADIUS Clients Configuration
#
# Only static entries that will never be in the routers table belong here.
# All MikroTik router clients are loaded dynamically from the database via
# the client_query in sql.conf (read_clients = yes).

client localhost {
    ipaddr = 127.0.0.1
    proto = *
    secret = testing123
    require_message_authenticator = no
    shortname = "localhost"
}

# Dynamic client discovery for the WireGuard VPN subnet.
#
# When a packet arrives from a 10.100.0.x IP that is NOT already in the
# in-memory client table (i.e. a router added after FreeRADIUS started),
# FreeRADIUS routes the packet to dynamic_sql_client_server (defined at the
# bottom of sites-enabled/default) which queries the routers table for the
# matching wg_tunnel_ip and returns the per-router secret. The discovered
# client is cached for 300 s (FreeRADIUS-Client-Lifetime), after which the
# next packet re-queries SQL. More-specific /32 entries loaded at startup via
# read_clients always win over this /24 block, so existing routers pay no SQL
# overhead per request.
#
# No secret is set here — the parent /24 block is never used to validate a
# packet; it only gates which subnet is eligible for dynamic lookup.
client wg_vpn_dynamic {
    ipaddr = 10.100.0.0/24
    require_message_authenticator = no
    dynamic_clients = dynamic_sql_client_server
    # Discovered client cached for 300 s. After expiry the next packet re-queries
    # SQL, so a router deactivated in the DB (is_active=false) is rejected within
    # 300 s with no restart needed. Startup-loaded clients (read_clients) have no
    # TTL and still require a full restart to deactivate — unchanged from before.
    lifetime = 300
}

# CATCH-ALL fallback (rollback safety — do NOT remove yet).
#
# Covers radtest from the host/containers AND, under bridge networking with
# userland-proxy, router requests whose source IP is SNATed into 172.16/12. It
# uses a SHARED secret (testing123), so any router matching here is NOT being
# authenticated by its own per-router SQL client. The distinct shortname makes
# that obvious in `radiusd -X` and in the authorize log line (sites-enabled/
# default), so we can tell whether per-router SQL clients are actually in use.
# Removal is a separate task, only after live validation confirms every router
# authenticates via its own named SQL client.
client docker_network {
    ipaddr = 172.16.0.0/12
    proto = *
    secret = testing123
    require_message_authenticator = no
    shortname = "CATCHALL_docker_network"
}
